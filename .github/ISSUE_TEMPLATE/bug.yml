---
name: "Bug report"
description: "Report a bug with the integration"
body:
- type: markdown
  attributes:
    value: Before you open a new issue, search through the existing issues to see if others have had the same problem.
- type: textarea
  attributes:
    label: "System Health details"
    description: "Paste the data from the System Health card in Home Assistant (https://www.home-assistant.io/more-info/system-health#github-issues)"
  validations:
    required: true
- type: checkboxes
  attributes:
    label: Checklist
    options:
      - label: I have enabled debug logging for my installation.
        required: true
      - label: I have filled out the issue template to the best of my ability.
        required: true
      - label: This issue only contains 1 issue (if you have multiple issues, open one issue for each issue).
        required: true
      - label: This issue is not a duplicate issue of any [previous issues](https://github.com/ant0nkr/luxpower-ha-integration/issues?q=is%3Aissue).
        required: true
- type: input
  attributes:
    label: "Inverter Model"
    description: "Your LuxPower inverter model (and firmware version, if known)."
    placeholder: "e.g. LXP-LB-5K / SNA 5000"
  validations:
    required: true
- type: dropdown
  attributes:
    label: "WiFi Dongle Type"
    description: "Dongle type shown in the LuxPower cloud (if known)."
    options:
      - "E-WIFI"
      - "E-WIFI ENC"
      - "Other / Unknown"
    default: 0
  validations:
    required: true
- type: dropdown
  attributes:
    label: "Register Block Size"
    description: "Register Block Size configured in the integration options."
    options:
      - "125"
      - "40"
    default: 0
  validations:
    required: true
- type: textarea
  attributes:
    label: "Describe the issue"
    description: "A clear and concise description of what the issue is."
  validations:
    required: true
- type: textarea
  attributes:
    label: Reproduction steps
    description: "Without steps to reproduce, it will be hard to fix. It is very important that you fill out this part. Issues without it will be closed."
    value: |
      1.
      2.
      3.
      ...
  validations:
    required: true
- type: textarea
  attributes:
    label: "Debug logs"
    description: "To enable debug logs check this https://www.home-assistant.io/integrations/logger/, this **needs** to include _everything_ from startup of Home Assistant to the point where you encounter the issue."
    render: text
  validations:
    required: true

- type: textarea
  attributes:
    label: "Diagnostics dump"
    description: "Drag the diagnostics dump file here. (see https://www.home-assistant.io/integrations/diagnostics/ for info)"